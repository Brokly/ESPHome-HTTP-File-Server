# Пример HTTPFS для ESPHome 2026.10.2.
# Работает ТОЛЬКО НА ESP32. Для Arduino выбор файловой системы обязателен.
substitutions:
  devicename: httpfs-arduino

external_components:
  - source:
      type: local
      path: my_components
    components: [httpfs]

esp32:
  board: esp32dev
  flash_size: 4MB #<<<<<<<<< эту настройку использует компонент httpfs
  framework:
    type: arduino #<<<<<<<<< Arduino: LittleFS, SPIFFS, FFat | ESP-IDF: только SPIFFS

esphome:
  name: ${devicename}
  project:
    name: "file_server.my"
    version: "ESP32"
  comment: "My test File Server Esp32"

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  # auth: digest #or basic  #<<<<<<<<< эти настройки может использовать компонент httpfs
  #   username: !secret web_user
  #   password: !secret web_pass

httpfs:
  id: http_fs_id
  filesystem: spiffs     # выбор файловой системы (LittleFS, SPIFFS, FFat); для фреймворка Arduino обязательно
  disk_kilobytes: 1500   # желаемый размер диска
  # auth:                 # авторизация для входа в веб-интерфейс управления файлами (http://ip/files/)
  #   username: "USER"   # если требуется установка пароля/логина, а в web_server таких установок нет
  #   password: "PASSWORD" # если не задать логин и пароль, настройки будут аналогичны компоненту web_server
  # web_auth: false       # при наличии аутентификации в web_server делает доступ к файловому серверу беспарольным
  # ext_http_report: false # отключить текстовую расшифровку ошибок в веб-интерфейсе (небольшое уменьшение размера прошивки)

button:  # если нужно форматирование (удаляет все файлы!)
  - platform: template
    name: Format Storage
    on_press:
      - lambda: |-
          id(http_fs_id).storFormat();
